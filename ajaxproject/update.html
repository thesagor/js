<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Page Title</title>
    <link rel="stylesheet" href="/ajaxproject/css/miligram.min.css" />
  </head>
  <body>
    <!-- Your content here -->

    <div class="container">
      <div id="table"></div>
    </div>

    <script>
      // Wait for DOM to be fully loaded before loading GSAP
      document.addEventListener('DOMContentLoaded', function() {
        // Only load GSAP script after DOM is ready
        const script = document.createElement('script');
        script.src = '/js/index.js';
        script.onload = function() {
          console.log('GSAP loaded successfully');
          // Add any GSAP animations here after the library is loaded
          // Example: gsap.to("#table", {duration: 1, opacity: 1});
        };
        script.onerror = function() {
          console.error('Failed to load GSAP library');
        };
        document.head.appendChild(script);
      });
    </script>
  </body>
</html>
